name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Prettier check
        run: npm run format:check

  fe-lint:
    name: FE lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Lint web
        run: npm run lint -w @remunify/web

  fe-typecheck:
    name: FE typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Typecheck web
        run: npm run typecheck -w @remunify/web

  fe-test:
    name: FE test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Test web (if present)
        run: npm run test -w @remunify/web --if-present

  be-lint:
    name: BE lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Lint api
        run: npm run lint -w @remunify/api

  be-typecheck:
    name: BE typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Typecheck api
        run: npm run typecheck -w @remunify/api

  be-test:
    name: BE test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Test api (if present)
        run: npm run test -w @remunify/api --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-npm
      - name: Production build
        run: npm run build

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs:
      - format
      - fe-lint
      - fe-typecheck
      - fe-test
      - be-lint
      - be-typecheck
      - be-test
      - build
    steps:
      - name: All required checks passed
        run: echo "CI green"
